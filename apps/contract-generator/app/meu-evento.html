<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosso casamento · Lotus</title>
<link rel="icon" type="image/png" href="/marca/icone.png">
<style>
  :root { --marca: #824634; --marca-2: #a8705c; --fundo: #f8f3ef; --borda: #eadcd4; --texto: #2b2220; --suave: #6f625d; --ok: #2f7a4f; --erro: #b3261e; --aviso: #9a6400; --azul: #2f5f8a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: var(--texto); background: var(--fundo); }
  header { background: #fffdfb; padding: 8px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--borda); }
  header img { height: 52px; } header .esp { flex: 1; } header .quem { font-size: 13px; color: var(--suave); text-align: right; }
  header a { color: var(--marca); font-weight: 600; text-decoration: none; font-size: 13px; }
  header select.seletor-idioma { width: auto; min-height: 34px; font-size: 13px; padding: 4px 8px; border-radius: 8px; color: var(--marca); font-weight: 600; }
  main { max-width: 980px; margin: 0 auto; padding: 14px 16px 48px; }
  .capa { text-align: center; padding: 16px 10px 4px; }
  .capa h1 { font-size: 28px; color: var(--marca); margin: 0; font-weight: 600; }
  .capa .data { color: var(--suave); margin-top: 4px; }
  .contagem { display: inline-block; margin-top: 10px; background: #fff; border: 1px solid var(--borda); border-radius: 99px; padding: 6px 16px; color: var(--marca); font-weight: 600; }
  .previa { background: #fff6e5; border: 1px solid #f0d9a8; color: var(--aviso); border-radius: 10px; padding: 8px 12px; font-size: 13px; margin-top: 10px; text-align: center; }

  /* abas */
  .abas { display: flex; gap: 6px; margin: 16px 0 4px; padding: 6px; background: var(--fundo); }
  .abas button { flex: 1; border: 1px solid var(--borda); background: #fff; color: var(--texto); border-radius: 12px; padding: 10px 12px; font: inherit; font-weight: 600; cursor: pointer; min-height: 46px; }
  .abas button[aria-selected="true"] { background: var(--marca); border-color: var(--marca); color: #fff; }
  .abas .n { font-weight: 400; font-size: 12.5px; opacity: .85; margin-left: 4px; }

  .card { background: #fff; border: 1px solid var(--borda); border-radius: 12px; padding: 16px 18px; margin-top: 12px; }
  .card h2 { font-size: 15px; color: var(--marca); margin: 0 0 10px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .kpi { border: 1px solid #f0e6e0; border-radius: 10px; padding: 10px 12px; background: #fdfaf8; }
  .kpi .r { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .3px; }
  .kpi .v { font-size: 20px; font-weight: 700; color: var(--marca); }
  .barra { height: 8px; background: #f1e7e1; border-radius: 99px; overflow: hidden; margin-top: 6px; } .barra i { display: block; height: 100%; background: var(--marca-2); }
  .s { font-size: 12.5px; color: var(--suave); }
  .filtros { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 0; }
  .filtros button { border: 1px solid var(--borda); background: #fff; border-radius: 99px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; min-height: 36px; }
  .filtros button[aria-pressed="true"] { background: #f3e6df; border-color: var(--marca-2); color: var(--marca); font-weight: 600; }

  /* preparativos */
  details.etapa { border-top: 1px solid #f3ebe6; padding: 10px 0; } details.etapa:first-of-type { border-top: 0; }
  details.etapa summary { cursor: pointer; font-weight: 600; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
  details.etapa summary::-webkit-details-marker { display: none; }
  details.etapa summary::before { content: "▸"; color: var(--marca-2); margin-right: 6px; } details.etapa[open] summary::before { content: "▾"; }
  details.etapa summary .tit { flex: 1; }
  .ativs { list-style: none; margin: 8px 0 0; padding: 0; }
  .tarefa { display: grid; grid-template-columns: minmax(0, 1fr) 170px minmax(0, 220px); gap: 8px; align-items: center; padding: 8px 0; border-top: 1px dashed #f1e7e1; }
  .tarefa:first-child { border-top: 0; }
  .tarefa .t { font-size: 14px; } .tarefa.feita .t { color: var(--suave); text-decoration: line-through; }
  .tarefa .det { font-size: 12px; color: var(--suave); }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; margin-left: 6px; vertical-align: 1px; }
  .tag.atr { background: #fde8e6; color: var(--erro); } .tag.voce { background: #e8f1ea; color: var(--ok); }
  select, input, textarea { font: inherit; font-size: 15px; border: 1px solid var(--borda); border-radius: 9px; padding: 8px 10px; background: #fff; color: var(--texto); width: 100%; min-height: 40px; }
  select.st-FINALIZADO { background: #e6f2ea; color: var(--ok); border-color: #bcdcc7; }
  select.st-EM-ANDAMENTO, select.st-EM-COTACAO { background: #fff4dc; color: var(--aviso); border-color: #f0d9a8; }
  select.st-NAO { background: #f1edea; color: var(--suave); }
  .salvando { font-size: 11.5px; color: var(--suave); min-height: 1em; }

  /* fornecedores */
  .alerta { border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .alerta.atr { background: #fde8e6; color: var(--erro); border: 1px solid #f5c2bd; }
  .venc { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-top: 1px solid #f3ebe6; font-size: 14px; } .venc:first-child { border-top: 0; }
  .forn { background: #fff; border: 1px solid var(--borda); border-radius: 12px; margin-top: 12px; overflow: hidden; }
  .forn-cab { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; cursor: pointer; }
  .forn-cab .nome { font-weight: 700; font-size: 15.5px; } .forn-cab .esp { flex: 1; min-width: 0; }
  .forn-cab .valores { text-align: right; white-space: nowrap; font-size: 13px; color: var(--suave); }
  .forn-cab .valores b { display: block; font-size: 15px; color: var(--texto); }
  .badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .b-ok { background: #e6f2ea; color: var(--ok); } .b-p { background: #efe9e5; color: var(--suave); } .b-atr { background: #fde8e6; color: var(--erro); }
  .forn-corpo { border-top: 1px solid #f3ebe6; padding: 12px 16px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .forn-corpo > * { min-width: 0; }
  .forn-corpo h4 { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .3px; color: var(--suave); }
  .linha { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; padding: 3px 0; }
  .pag { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #f3ebe6; font-size: 13.5px; } .pag:first-child { border-top: 0; } .pag .n { text-align: right; white-space: nowrap; }
  .pagar { background: #fdfaf8; border: 1px dashed var(--borda); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; word-break: break-word; }
  .lk { color: var(--marca); font-weight: 600; text-decoration: none; } .lk:hover { text-decoration: underline; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--borda); background: #fff; color: var(--marca); border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer; min-height: 42px; }
  .btn.primario { background: var(--marca); border-color: var(--marca); color: #fff; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .acoes { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }

  /* janela de pagamento */
  dialog { border: 0; border-radius: 16px; padding: 0; width: min(520px, calc(100vw - 16px)); max-height: calc(100dvh - 16px); box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  dialog::backdrop { background: rgba(43, 34, 32, .45); }
  dialog form { padding: 18px 18px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  dialog h3 { grid-column: 1 / -1; margin: 0; color: var(--marca); font-size: 18px; }
  dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; }
  dialog .largo { grid-column: 1 / -1; }
  dialog .aviso { grid-column: 1 / -1; background: #fff6e5; border: 1px solid #f0d9a8; color: #7a5200; border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  dialog .erro { grid-column: 1 / -1; color: var(--erro); font-size: 13.5px; font-weight: 600; }
  dialog .botoes { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #2b2220; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  footer { text-align: center; color: var(--suave); font-size: 12px; margin-top: 26px; }

  @media (max-width: 700px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis .kpi:last-child:nth-child(odd) { grid-column: 1 / -1; }
    .tarefa { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } .tarefa > div:first-child { grid-column: 1 / -1; }
    .forn-corpo { grid-template-columns: 1fr; }
    .capa h1 { font-size: 24px; }
    dialog form { grid-template-columns: 1fr; }
    header { padding: 6px 12px; } header img { height: 40px; }
  }
</style>
<link rel="stylesheet" href="/movel.css"><script src="/movel.js" defer></script><script src="/campos.js" defer></script>
<script src="/idioma.js"></script>
<script src="/acompanhamento.js"></script>
</head>
<body>
<header><img src="/marca/logo.png" alt="Tayná Alves Assessoria e Produção"><div class="esp"></div><span id="idiomaSel"></span><div class="quem" id="quem"></div></header>
<main id="conteudo"><div class="s" style="text-align:center;padding:40px" data-i18n="carregando">Carregando…</div></main>
<footer>Lotus · Tayná Alves Assessoria e Produção</footer>

<dialog id="dlgPag" aria-labelledby="dlgTit">
  <form method="dialog" id="formPag">
    <h3 id="dlgTit" data-i18n="enviar_pag">Enviar pagamento</h3>
    <p class="s largo" id="dlgForn" style="margin:-6px 0 0"></p>
    <label><span data-i18n="dlg_oque">O que foi pago</span><select name="tipo"><option value="entrada" data-i18n="tp_entrada">Entrada</option><option value="parcela" data-i18n="tp_parcela">Parcela</option><option value="avulso" data-i18n="tp_avulso">Pagamento avulso</option></select></label>
    <label><span data-i18n="dlg_valor">Valor (R$)</span><input name="valor" inputmode="decimal" placeholder="0,00" required></label>
    <label><span data-i18n="dlg_data">Data do pagamento</span><input name="data" type="date" required></label>
    <label><span data-i18n="dlg_forma">Forma</span><select name="forma"><option value="PIX" data-i18n="f_PIX">PIX</option><option value="Transferência" data-i18n="f_Transferência">Transferência</option><option value="Boleto" data-i18n="f_Boleto">Boleto</option><option value="Cartão" data-i18n="f_Cartão">Cartão</option><option value="Dinheiro" data-i18n="f_Dinheiro">Dinheiro</option></select></label>
    <label class="largo"><span data-i18n="dlg_comp">Comprovante (foto ou PDF)</span><input name="comprovante" type="file" accept="image/*,application/pdf" required></label>
    <label class="largo"><span data-i18n="dlg_obs">Observação (opcional)</span><input name="obs" maxlength="300" placeholder="Ex.: parcela de dezembro" data-i18n-ph="dlg_obs_ex"></label>
    <p class="aviso" data-i18n-html="dlg_aviso">Depois de enviado, o pagamento <b>não pode ser alterado</b> por vocês. Se algo estiver errado, fale com a Tayná.</p>
    <p class="erro" id="erroPag" role="alert" hidden></p>
    <div class="botoes"><button type="button" class="btn" id="btnCancelar" data-i18n="cancelar">Cancelar</button><button type="submit" class="btn primario" id="btnEnviarPag" data-i18n="enviar_pag">Enviar pagamento</button></div>
  </form>
</dialog>

<script>
const t = I18N.t;
I18N.aplicar(); document.title = `${t('titulo')} · Lotus`;
document.getElementById('idiomaSel').innerHTML = I18N.seletor(); I18N.ligarSeletor();
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const moeda = I18N.moeda;
const dBr = (iso) => I18N.data(iso);
const hojeIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const classeSt = (st) => st === 'FINALIZADO' ? 'st-FINALIZADO' : st === 'EM ANDAMENTO' ? 'st-EM-ANDAMENTO' : st === 'EM COTAÇÃO' ? 'st-EM-COTACAO' : /^NÃO/.test(st) ? 'st-NAO' : '';
const ARQ = new URLSearchParams(location.search).get('arquivo') || '';
const comArq = (url) => `${url}${url.includes('?') ? '&' : '?'}idioma=${I18N.idioma}${ARQ ? `&arquivo=${encodeURIComponent(ARQ)}` : ''}`;
let D = null; let aba = 'prep'; let filtro = 'afazer'; let visao = (() => { try { return localStorage.getItem('lotus-visao') || 'lista'; } catch { return 'lista'; } })(); const abertos = new Set();

function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }

async function carregar() {
  const r = await fetch(comArq('/api/meu-evento'));
  const d = await r.json();
  if (!r.ok) throw new Error(d.erro || 'Erro');
  D = d; if (!D.cronograma && aba === 'prep') aba = 'forn';
  desenhar();
}

function desenhar() {
  const ev = D.evento;
  const [dd, mm, aa] = String(ev.data || '').split('/');
  const dataEv = aa ? new Date(+aa, +mm - 1, +dd) : null;
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dias = dataEv ? Math.round((dataEv - hoje) / 864e5) : null;
  const c = D.cronograma;
  const pend = c ? c.secoes.reduce((n, s) => n + s.itens.filter((i) => !i.concluida).length, 0) : 0;
  document.getElementById('conteudo').innerHTML = `
    <div class="capa"><h1>${esc(ev.nomes)}</h1>
      <div class="data">${esc(ev.data ? I18N.data(ev.data, true) : ev.periodo || t('data_definir'))}${ev.horario ? ` · ${esc(ev.horario)}` : ''}${ev.local ? ` · ${esc(ev.local)}` : ''}</div>
      ${dias !== null ? `<div class="contagem">${dias > 1 ? t('faltam_dias', { n: dias }) : dias === 1 ? t('amanha') : dias === 0 ? t('hoje_e') : t('realizado')}</div>` : ''}
      ${ARQ ? `<div class="previa">${t('previa')}</div>` : ''}</div>
    <div class="abas" role="tablist">
      ${c ? `<button role="tab" aria-selected="${aba === 'prep'}" data-aba="prep">${t('aba_prep')}<span class="n">(${pend})</span></button>` : ''}
      <button role="tab" aria-selected="${aba === 'forn'}" data-aba="forn">${t('aba_forn')}<span class="n">(${D.fornecedores.length})</span></button>
    </div>
    ${(D.alertas || []).some((a) => a.nivel !== 'info') ? `<div class="card"><h2>${t('atencao')}</h2><div id="alertas"></div></div>` : ''}
    <div id="painel">${aba === 'prep' && c ? painelPrep(c) : painelForn()}</div>`;
  const al = document.getElementById('alertas'); if (al) Acomp.alertas(al, D.alertas, { semInfo: true });
  const bd = document.getElementById('bd'); if (bd) Acomp.burndown(bd, D.burndown);
  const kb = document.getElementById('kb');
  if (kb) Acomp.quadro(kb, { itens: Acomp.itensDoCronograma(c), etapaAtual: Acomp.etapaAtual(c), tagCasal: t('tag_voces'),
    onMudar: async (chave, mud) => {
      const it = Acomp.itensDoCronograma(D.cronograma).find((x) => x.chave === chave) || {};
      const r = await fetch(comArq('/api/meu-evento/tarefa'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ arquivo: ARQ || undefined, idioma: I18N.idioma, chave, status_atual: it.status || '', ...mud }) });
      const d = await r.json(); if (!r.ok) throw new Error(d.erro || t('erro_salvar'));
      D = d; desenhar(); toast(mud.status === 'FINALIZADO' ? t('concluida_ok') : t('salvo'));
    } });
}

// ---------------- Preparativos ----------------
function linhaTarefa(i) {
  return `<li class="tarefa ${i.concluida ? 'feita' : ''}" data-chave="${esc(i.chave)}">
    <div><span class="t">${esc(i.texto)}</span>${i.atrasada && !i.concluida ? `<span class="tag atr">${t('tag_atrasada')}</span>` : ''}${i.pelo_casal ? `<span class="tag voce" title="${t('tag_voces_tit')}">${t('tag_voces')}</span>` : ''}
      ${i.fornecedor ? `<div class="det">${esc(i.fornecedor)}</div>` : ''}<div class="salvando" aria-live="polite"></div></div>
    <select class="${classeSt(i.status)}" data-st aria-label="${t('situacao')}: ${esc(i.texto)}">${D.status_tarefa.map((st) => `<option value="${esc(st)}" ${st === i.status ? 'selected' : ''}>${esc(I18N.status(st))}</option>`).join('')}</select>
    <input data-obs value="${esc(i.obs)}" maxlength="500" placeholder="${t('obs')}" aria-label="${t('obs')}: ${esc(i.texto)}">
  </li>`;
}
function painelPrep(c) {
  const r = c.ritmo;
  const secoes = c.secoes.filter((s) => s.itens.length);
  const lista = filtro === 'feitas'
    ? `<ul class="ativs">${c.concluidas.map(linhaTarefa).join('') || `<li class="s">${t('nenhuma_concluida')}</li>`}</ul>`
    : secoes.map((s) => {
      const atual = s.situacao === 'atual' || s.situacao === 'vencida';
      const aberto = abertos.has(s.rotulo) || (abertos.size === 0 && atual) || filtro === 'todas';
      const titulo = s.meses ? I18N.etapa(s.meses) : s.rotulo;
      return `<details class="etapa" data-sec="${esc(s.rotulo)}" ${aberto ? 'open' : ''}><summary><span class="tit">${esc(titulo.charAt(0).toUpperCase() + titulo.slice(1))}</span>
        <span class="s">${t('n_a_fazer', { n: s.itens.filter((i) => !i.concluida).length })}${s.inicio ? ` · ${esc(t('periodo', { ini: I18N.data(s.inicio), fim: I18N.data(s.fim) }))}` : ''}</span></summary>
        <ul class="ativs">${s.itens.filter((i) => filtro !== 'afazer' || !i.concluida).map(linhaTarefa).join('') || `<li class="s">${t('etapa_feita')}</li>`}</ul></details>`;
    }).join('') || `<p class="s">${t('nada_pendente')}</p>`;
  return `<div class="card">
    <div class="kpis">
      <div class="kpi"><div class="r">${t('kpi_concluidas')}</div><div class="v">${t('x_de_y', { a: r.concluidas, b: r.total })}</div><div class="barra"><i style="width:${r.percentual}%"></i></div></div>
      <div class="kpi"><div class="r">${t('kpi_andamento')}</div><div class="v">${r.em_andamento || 0}</div></div>
      <div class="kpi"><div class="r">${t('kpi_ritmo')}</div><div class="v" style="font-size:16px">${r.situacao === 'atrasado' ? t('ritmo_atrasado') : r.situacao === 'adiantado' ? t('ritmo_adiantado') : t('ritmo_em_dia')}</div></div>
    </div>
    <p class="s" style="margin:12px 0 0">${t('ajuda_prep')}</p>
    <div class="filtros" role="group" aria-label="${t('ver_como')}">
      <button data-visao="lista" aria-pressed="${visao === 'lista'}">☰ ${t('v_lista')}</button>
      <button data-visao="quadro" aria-pressed="${visao === 'quadro'}">▦ ${t('v_quadro')}</button>
      <button data-visao="grafico" aria-pressed="${visao === 'grafico'}">📉 ${t('v_grafico')}</button>
    </div>
    ${visao === 'lista' ? `<div class="filtros" role="group" aria-label="${t('mostrar')}">
      <button data-filtro="afazer" aria-pressed="${filtro === 'afazer'}">${t('f_afazer')}</button>
      <button data-filtro="todas" aria-pressed="${filtro === 'todas'}">${t('f_todas')}</button>
      <button data-filtro="feitas" aria-pressed="${filtro === 'feitas'}">${t('f_feitas', { n: c.concluidas.length })}</button>
    </div>` : ''}</div>
    ${visao === 'quadro' ? `<div class="card" style="padding:12px"><p class="s" style="margin:0 0 8px">${t('ajuda_quadro')}</p><div id="kb"></div></div>`
      : visao === 'grafico' ? `<div class="card"><h2>${t('tit_grafico')}</h2><div id="bd"></div><p class="s" style="margin:10px 0 0">${t('ajuda_grafico')}</p></div>`
      : `<div class="card">${lista}</div>`}`;
}

async function salvarTarefa(li, mudanca) {
  const aviso = li.querySelector('.salvando'); aviso.textContent = t('salvando');
  const chave = li.dataset.chave;
  const it = [...D.cronograma.secoes.flatMap((s) => s.itens), ...D.cronograma.concluidas].find((x) => x.chave === chave) || {};
  try {
    const r = await fetch(comArq('/api/meu-evento/tarefa'), { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ arquivo: ARQ || undefined, idioma: I18N.idioma, chave, status_atual: it.status || '', ...mudanca }) });
    const d = await r.json(); if (!r.ok) throw new Error(d.erro || t('erro_salvar'));
    D = d;
    if (mudanca.status !== undefined) { desenhar(); toast(mudanca.status === 'FINALIZADO' ? t('concluida_ok') : t('situacao_ok')); }
    else aviso.textContent = t('salvo');
  } catch (e) { aviso.textContent = ''; toast(e.message); }
}

// ---------------- Fornecedores ----------------
function painelForn() {
  const tot = D.totais;
  if (!D.fornecedores.length) return `<div class="card"><p class="s" style="margin:0">${t('forn_vazio')}</p></div>`;
  const atr = D.atrasados || [];
  return `${tot ? `<div class="card"><div class="kpis">
      <div class="kpi"><div class="r">${t('kpi_contratado')}</div><div class="v">${moeda(tot.contratado)}</div></div>
      <div class="kpi"><div class="r">${t('kpi_pago')}</div><div class="v">${moeda(tot.pago)}</div><div class="barra"><i style="width:${tot.percentual}%"></i></div></div>
      <div class="kpi"><div class="r">${t('kpi_apagar')}</div><div class="v">${moeda(tot.saldo)}</div></div></div>
      ${atr.length ? `<div class="alerta atr"><b>${t('parcelas_vencidas', { n: atr.length })}</b> ${atr.slice(0, 4).map((v) => `${esc(v.fornecedor)} (${dBr(v.vencimento)})`).join(', ')}${atr.length > 4 ? '…' : ''}</div>` : ''}
      ${D.proximos.length ? `<h2 style="margin-top:14px">${t('proximos')}</h2>${D.proximos.map((v) => `<div class="venc"><span>${dBr(v.vencimento)} · ${esc(v.fornecedor)}</span><b>${moeda(v.valor)}</b></div>`).join('')}` : ''}
    </div>` : ''}
    ${D.fornecedores.map(cartaoForn).join('')}`;
}
function cartaoForn(f) {
  const aberto = abertos.has(f.id);
  const st = f.status === 'Pago' ? `<span class="badge b-ok">${t('b_quitado')}</span>` : f.atrasadas ? `<span class="badge b-atr">${t('b_vencida')}</span>` : f.status === 'Sem valor' ? `<span class="badge b-p">${t('b_sem_valor')}</span>` : `<span class="badge b-p">${t('b_aberto')}</span>`;
  const pct = f.contratado ? Math.min(100, Math.round((f.pago / f.contratado) * 100)) : 0;
  const ct = f.contato || {};
  const whats = String(ct.telefone || '').replace(/\D/g, '');
  const contato = [ct.responsavel && esc(ct.responsavel),
    ct.telefone && `<a class="lk" href="https://wa.me/${String(ct.telefone).trim().startsWith('+') || whats.length > 11 ? whats : `55${whats}`}" target="_blank" rel="noopener">${esc(ct.telefone)}</a>`,
    ct.email && `<a class="lk" href="mailto:${esc(ct.email)}">${esc(ct.email)}</a>`,
    ct.instagram && `<a class="lk" href="https://instagram.com/${esc(String(ct.instagram).replace(/^@/, ''))}" target="_blank" rel="noopener">${esc(ct.instagram)}</a>`].filter(Boolean);
  return `<div class="forn" data-id="${esc(f.id)}">
    <div class="forn-cab" data-abrir="${esc(f.id)}" role="button" tabindex="0" aria-expanded="${aberto}">
      <div class="esp"><div class="nome">${esc(f.nome)} ${st}</div><div class="s">${esc(f.servico || f.descricao).slice(0, 80)}</div>
        <div class="barra" style="max-width:260px"><i style="width:${pct}%"></i></div></div>
      <div class="valores">${t('a_pagar_min')}<b>${f.status === 'Pago' ? '—' : moeda(f.saldo)}</b>${f.proxima ? t('prox', { d: dBr(f.proxima.vencimento) || '—' }) : ''}</div>
    </div>
    ${aberto ? `<div class="forn-corpo">
      <div><h4>${t('h_valores')}</h4>
        <div class="linha"><span>${t('kpi_contratado')}</span><b>${moeda(f.contratado)}</b></div>
        <div class="linha"><span>${t('kpi_pago')}</span><b>${moeda(f.pago)}</b></div>
        <div class="linha"><span>${t('kpi_apagar')}</span><b>${moeda(f.saldo)}</b></div>
        ${f.entrada.prevista ? `<div class="linha"><span>${t('l_entrada')}</span><span>${moeda(f.entrada.prevista)} · ${f.entrada.paga ? t('paga_ok') : t('a_pagar_min')}</span></div>` : ''}
        ${f.parcelas.total ? `<div class="linha"><span>${t('l_parcelas')}</span><span>${t('x_de_y', { a: f.parcelas.pagas, b: f.parcelas.total })}${f.parcelas.valor ? ` × ${moeda(f.parcelas.valor)}` : ''}</span></div>` : ''}
        ${f.vencimentos.length ? `<div class="s" style="margin-top:6px">${f.vencimentos.map((v) => `${t('ord', { n: v.numero })} ${dBr(v.vencimento) || '—'} ${v.paga ? '✔' : v.vencimento && v.vencimento < hojeIso() ? `<b style="color:var(--erro)">${t('venc_vencida')}</b>` : ''}`).join(' · ')}</div>` : ''}
      </div>
      <div>${contato.length ? `<h4>${t('h_contato')}</h4><div style="display:flex;flex-direction:column;gap:2px;font-size:14px">${contato.join('')}</div>` : ''}
        ${f.pagar_com ? `<h4 style="margin-top:${contato.length ? 12 : 0}px">${t('h_dados')}</h4><div class="pagar">${esc(f.pagar_com)}</div>` : ''}
        ${f.descricao && f.servico ? `<h4 style="margin-top:12px">${t('h_contratado')}</h4><div style="font-size:14px">${esc(f.descricao)}</div>` : ''}
      </div>
      <div class="largo" style="grid-column:1/-1"><h4>${t('h_pagamentos')}</h4>
        ${f.pagamentos.length ? `<div class="pags">${f.pagamentos.map((p) => `<div class="pag"><div><b>${dBr(p.data) || '—'}</b> · ${p.tipo === 'parcela' ? `${t('p_parcela')}${p.numero ? ` ${p.numero}` : ''}` : p.tipo === 'entrada' ? t('p_entrada') : t('p_avulso')}${p.forma ? ` · ${esc(t(`f_${p.forma}`) === `f_${p.forma}` ? p.forma : t(`f_${p.forma}`))}` : ''}${p.pelo_casal ? ` <span class="tag voce">${t('p_voces')}</span>` : ''}</div>
          <div class="n"><b>${moeda(p.valor)}</b>${p.comprovante ? `<div class="s">${t('comprov_ok')}</div>` : ''}</div></div>`).join('')}</div>` : `<p class="s" style="margin:0">${t('nenhum_pag')}</p>`}
      </div>
      <div class="acoes">${f.status !== 'Pago' ? `<button class="btn primario" data-pagar="${esc(f.id)}">${t('enviar_pag')}</button>` : ''}</div>
    </div>` : ''}
  </div>`;
}

// ---------------- janela "Enviar pagamento" ----------------
const dlg = document.getElementById('dlgPag'); const formPag = document.getElementById('formPag'); const erroPag = document.getElementById('erroPag');
let fornPag = null;
function abrirPagamento(id) {
  fornPag = D.fornecedores.find((f) => f.id === id); if (!fornPag) return;
  formPag.reset(); erroPag.hidden = true;
  document.getElementById('dlgForn').textContent = fornPag.nome;
  const e = fornPag.entrada;
  const tipo = e.prevista && !e.paga ? 'entrada' : fornPag.parcelas.total ? 'parcela' : 'avulso';
  formPag.tipo.value = tipo;
  const sugestao = tipo === 'entrada' ? e.prevista : fornPag.proxima ? fornPag.proxima.valor : null;
  formPag.valor.value = sugestao ? Number(sugestao).toLocaleString('pt-BR', { minimumFractionDigits: 2 }) : '';  // o servidor lê no formato brasileiro
  formPag.data.value = hojeIso();
  dlg.showModal();
}
document.getElementById('btnCancelar').addEventListener('click', () => dlg.close());
formPag.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const arq = formPag.comprovante.files[0];
  const erro = (m) => { erroPag.textContent = m; erroPag.hidden = false; };
  if (!formPag.valor.value.trim()) return erro(t('e_valor'));
  if (!formPag.data.value) return erro(t('e_data'));
  if (!arq) return erro(t('e_comp'));
  if (arq.size > 15 * 1024 * 1024) return erro(t('e_grande'));
  const dados = { id: fornPag.id, tipo: formPag.tipo.value, valor: formPag.valor.value, data: formPag.data.value, forma: formPag.forma.value, obs: formPag.obs.value };
  const btn = document.getElementById('btnEnviarPag'); btn.disabled = true; btn.textContent = t('enviando');
  try {
    const url = comArq(`/api/meu-evento/pagamento?dados=${encodeURIComponent(JSON.stringify(dados))}`);
    const r = await fetch(url, { method: 'POST', headers: { 'x-nome-arquivo': encodeURIComponent(arq.name) }, body: arq });
    const d = await r.json(); if (!r.ok) throw new Error(d.erro || t('erro_enviar'));
    D = d; abertos.add(fornPag.id); dlg.close(); desenhar(); toast(t('pag_ok'));
  } catch (e) { erro(e.message); }
  finally { btn.disabled = false; btn.textContent = t('enviar_pag'); }
});

// ---------------- eventos da página ----------------
const conteudo = document.getElementById('conteudo');
conteudo.addEventListener('click', (e) => {
  const b = e.target.closest('[data-aba]'); if (b) { aba = b.dataset.aba; abertos.clear(); desenhar(); return; }
  const fl = e.target.closest('[data-filtro]'); if (fl) { filtro = fl.dataset.filtro; desenhar(); return; }
  const vs = e.target.closest('[data-visao]'); if (vs) { visao = vs.dataset.visao; try { localStorage.setItem('lotus-visao', visao); } catch {} desenhar(); return; }
  const pg = e.target.closest('[data-pagar]'); if (pg) { abrirPagamento(pg.dataset.pagar); return; }
  const ab = e.target.closest('[data-abrir]');
  if (ab && !e.target.closest('a')) { const id = ab.dataset.abrir; abertos.has(id) ? abertos.delete(id) : abertos.add(id); desenhar(); }
});
conteudo.addEventListener('keydown', (e) => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-abrir]')) { e.preventDefault(); e.target.click(); } });
conteudo.addEventListener('toggle', (e) => { const d = e.target.closest('details[data-sec]'); if (d) { d.open ? abertos.add(d.dataset.sec) : abertos.delete(d.dataset.sec); } }, true);
conteudo.addEventListener('change', (e) => {
  const li = e.target.closest && e.target.closest('.tarefa'); if (!li) return;
  if (e.target.matches('[data-st]')) salvarTarefa(li, { status: e.target.value });
  else if (e.target.matches('[data-obs]')) salvarTarefa(li, { obs: e.target.value });
});

(async () => {
  try {
    const eu = await (await fetch('/api/eu')).json();
    if (eu.login) document.getElementById('quem').innerHTML = `${esc(eu.nome || eu.email)}<br><a href="/sair">${t('sair')}</a>`;
    await carregar();
  } catch (e) { conteudo.innerHTML = `<div class="card" style="color:var(--erro)">${esc(e.message)}</div>`; }
})();
</script>
</body>
