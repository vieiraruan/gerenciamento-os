<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checklist · Tayná Alves Assessoria</title>
<link rel="icon" type="image/png" href="/marca/icone.png">
<style>
  :root {
    --marca: #824634; --marca-2: #a8705c; --fundo: #f8f3ef; --card: #ffffff;
    --borda: #eadcd4; --texto: #2b2220; --suave: #7b6f6a; --ok: #2f7a4f; --erro: #b3261e; --aviso: #9a6400;
    --raio: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--texto); background: var(--fundo); }
  header { background: #fffdfb; color: var(--marca); padding: 8px 24px; display: flex; align-items: center; gap: 18px; position: sticky; top: 0; z-index: 5; border-bottom: 1px solid var(--borda); box-shadow: 0 2px 10px rgba(130,70,52,.06); }
  header img.logo { height: 58px; display: block; }
  header .sep { width: 1px; align-self: stretch; background: var(--borda); margin: 6px 0; }
  header h1 { font-size: 18px; margin: 0; font-weight: 600; }
  header .sub { color: var(--suave); font-size: 13px; }
  header .esp { flex: 1; }
  header a.voltar { color: var(--marca); font-weight: 600; text-decoration: none; padding: 9px 12px; border-radius: 8px; }
  header a.voltar:hover { background: #f3ece7; }

  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; padding: 20px 24px; align-items: start; }
  @media (max-width: 860px) { .layout { grid-template-columns: 1fr; padding: 12px; } }
  .card { background: var(--card); border: 1px solid var(--borda); border-radius: var(--raio); padding: 18px 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: var(--marca); }
  input { width: 100%; padding: 9px 11px; border: 1px solid var(--borda); border-radius: 8px; font: inherit; background: #fffdfb; }
  .lista { list-style: none; margin: 0; padding: 0; max-height: calc(100vh - 230px); overflow: auto; }
  .lista li { padding: 9px 11px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .lista li:hover { background: #f3ece7; }
  .lista li.ativo { background: #f3e6df; border-color: var(--borda); }
  .lista .num { font-size: 12px; font-weight: 700; color: var(--marca); }
  .lista .nome { font-weight: 600; }
  .lista .det { font-size: 12px; color: var(--suave); }
  .lista .grupo { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .4px; padding: 10px 4px 4px; cursor: default; }
  .lista .grupo:hover { background: none; }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #efe4dd; color: var(--marca); vertical-align: middle; }
  .tag.dest { background: #e3eef6; color: #1f4e78; }
  .vazio { color: var(--suave); font-size: 14px; padding: 6px 2px; }

  .topo { display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
  .topo .info { flex: 1; min-width: 260px; }
  .topo .info h3 { margin: 0; font-size: 22px; color: var(--marca); font-weight: 600; }
  .topo dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; margin: 10px 0 0; font-size: 14px; }
  .topo dt { color: var(--suave); }
  .topo dd { margin: 0; }
  .acoes { display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
  .seg { display: flex; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; }
  .seg button { flex: 1; border: 0; border-radius: 0; padding: 9px 10px; font: inherit; font-size: 13px; font-weight: 600; color: var(--suave); background: #fff; cursor: pointer; }
  .seg button.on { background: var(--marca); color: #fff; }
  .seg button:disabled { cursor: not-allowed; opacity: .6; }
  button.btn { font: inherit; border-radius: 10px; border: 1px solid var(--marca); padding: 11px 14px; cursor: pointer; background: #fff; color: var(--marca); font-weight: 600; }
  button.btn:hover { background: #f3ece7; }
  button.btn.primario { background: var(--marca); color: #fff; }
  button.btn.primario:hover { background: #6c3a2b; }
  button.btn:disabled { opacity: .5; cursor: default; }
  .aviso { border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-top: 10px; }
  .aviso.erro { background: #fbeceb; color: var(--erro); }
  .aviso.ok { background: #edf6f0; color: var(--ok); }
  .aviso.info { background: #fdf6e7; color: var(--aviso); }
  .aviso button { margin: 8px 8px 0 0; padding: 7px 12px; font-size: 13px; }

  .resumo { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 14px; }
  .resumo span { font-size: 13px; background: #fff; border: 1px solid var(--borda); border-radius: 99px; padding: 4px 12px; }
  .secao { border: 1px solid var(--borda); border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: #fff; }
  .secao > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #faf5f1; }
  .secao > summary::-webkit-details-marker { display: none; }
  .secao > summary::before { content: '▸'; color: var(--marca); transition: transform .15s; }
  .secao[open] > summary::before { transform: rotate(90deg); }
  .secao .rot { font-weight: 700; color: var(--marca); }
  .secao .per { font-size: 13px; color: var(--suave); }
  .secao .qtd { margin-left: auto; font-size: 12px; color: var(--suave); }
  .sit { font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 99px; }
  .sit.vencida { background: #fbeceb; color: var(--erro); }
  .sit.atual { background: #e6f2ea; color: var(--ok); }
  .sit.futura { background: #f0ebe8; color: var(--suave); }
  .itens { list-style: none; margin: 0; padding: 4px 14px 10px; }
  .itens li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 6px 0; border-top: 1px solid #f3ebe6; font-size: 14px; }
  .itens li:first-child { border-top: 0; }
  .itens .o { color: var(--suave); font-weight: 700; text-align: right; }
  .itens.horas li { grid-template-columns: 54px 1fr; gap: 14px; }
  .itens.horas .o { color: var(--marca); }
  .novo { font-size: 10px; font-weight: 700; color: #1f4e78; background: #e3eef6; border-radius: 99px; padding: 1px 7px; margin-left: 6px; }
  .grade { display: grid; grid-template-columns: repeat(12, 1fr); gap: 10px 12px; }
  .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c12 { grid-column: span 12; }
  @media (max-width: 900px) { .c3, .c4, .c6 { grid-column: span 12; } }
  label.l { display: block; font-size: 11px; font-weight: 700; color: var(--suave); margin-bottom: 3px; text-transform: uppercase; letter-spacing: .3px; }
  .card input, .card select, .card textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--borda); border-radius: 7px; font: inherit; font-size: 14px; background: #fffdfb; }
  .card textarea { min-height: 60px; }
  .card .c6 textarea { min-height: 96px; }
  .card input.falta, .card select.falta { border-color: var(--erro); background: #fff6f5; }
  table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.t th { text-align: left; font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: .3px; padding: 4px 4px 6px; }
  table.t td { padding: 3px 4px; vertical-align: top; border-top: 1px solid #f3ebe6; }
  table.t input, table.t select { padding: 6px 7px; font-size: 13px; }
  table.t select[data-c=categoria] { min-width: 165px; } table.t select[data-c=dia] { min-width: 175px; }
  table.t select[data-c=fornecedor_id] { min-width: 160px; } table.t input[type=time] { min-width: 105px; }
  .x { border: 0; background: none; color: var(--suave); font-size: 18px; cursor: pointer; padding: 4px 6px; }
  .x:hover { color: var(--erro); }
  .linha-acoes { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .pend { list-style: none; margin: 6px 0 0; padding: 0; max-height: 180px; overflow: auto; font-size: 13px; color: var(--erro); }
  .pend li::before { content: '• '; }
  .ok-tudo { color: var(--ok); font-weight: 600; }
  .salvo { font-size: 12px; color: var(--suave); }
  .passo { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--marca); color: #fff; font-size: 12px; margin-right: 6px; }
</style>
</head>
<body>
<header>
  <a href="/" title="Voltar para o início"><img class="logo" src="/marca/logo.png" alt="Tayná Alves Assessoria e Produção"></a>
  <div class="sep"></div>
  <div>
    <h1>Gerador de Checklist</h1>
    <div class="sub">Checklist e painel do dia do evento, e cronograma de tarefas até o casamento</div>
  </div>
  <div class="esp"></div>
  <a class="voltar" href="/">← Início</a>
</header>

<div class="layout">
  <aside>
    <div class="card">
      <h2>Casais</h2>
      <input id="busca" placeholder="Buscar por nome ou número…" style="margin-bottom:10px">
      <ul class="lista" id="lista"><li class="vazio">Carregando…</li></ul>
    </div>
  </aside>

  <main id="principal">
    <div class="card"><div class="vazio">Escolha um casal na lista ao lado para montar o checklist.</div></div>
  </main>
</div>

<script>
const api = async (url, corpo) => {
  const r = await fetch(url, corpo ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.erro || 'Erro');
  return j;
};
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (s) => document.querySelector(s);
const dataBr = (s) => { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(s || '').trim()); return m ? new Date(+m[3], +m[2] - 1, +m[1]) : null; };
const SIT = { vencida: 'prazo passou', atual: 'agora', futura: 'próxima' };

let contratos = [];
let vertentes = [];
let atual = null;     // arquivo do contrato selecionado
let vertente = 'destination';

function renderLista() {
  const q = $('#busca').value.trim().toLowerCase();
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const filtrados = contratos.filter((c) => !q || `${c.numero_os} ${c.evento_nomes}`.toLowerCase().includes(q))
    .map((c) => ({ ...c, d: dataBr(c.evento_data) }));
  const futuros = filtrados.filter((c) => !c.d || c.d >= hoje).sort((a, b) => (a.d || Infinity) - (b.d || Infinity));
  const passados = filtrados.filter((c) => c.d && c.d < hoje).sort((a, b) => b.d - a.d);
  const item = (c) => `<li data-a="${esc(c.arquivo)}" class="${c.arquivo === atual ? 'ativo' : ''}">
      <div class="num">${esc(c.numero_os || 'sem número')} ${/^s/i.test(c.destination) ? '<span class="tag dest">Destination</span>' : ''}</div>
      <div class="nome">${esc(c.evento_nomes || c.arquivo)}</div>
      <div class="det">${esc(c.evento_data || 'data a definir')}${c.evento_local ? ' · ' + esc(c.evento_local) : ''}</div></li>`;
  $('#lista').innerHTML =
    (futuros.length ? '<li class="grupo">Próximos eventos</li>' + futuros.map(item).join('') : '') +
    (passados.length ? '<li class="grupo">Eventos que já passaram</li>' + passados.map(item).join('') : '') ||
    '<li class="vazio">Nenhum contrato encontrado.</li>';
  document.querySelectorAll('#lista li[data-a]').forEach((li) => li.onclick = () => selecionar(li.dataset.a));
}

async function selecionar(arquivo) {
  atual = arquivo;
  renderLista();
  $('#principal').innerHTML = '<div class="card"><div class="vazio">Montando checklist…</div></div>';
  try {
    const ck = await api(`/api/checklist/previa?arquivo=${encodeURIComponent(arquivo)}&vertente=${vertente}`);
    renderChecklist(ck);
  } catch (e) {
    $('#principal').innerHTML = `<div class="card"><div class="aviso erro">${esc(e.message)}</div></div>`;
  }
}

let EV = null;          // dados do dia do evento
let META = { categorias: [], dias: {}, planilha: {} };
let PEND = [];
let tSalvar = null;

function renderChecklist(ck) {
  const e = ck.evento;
  const cont = { vencida: 0, atual: 0, futura: 0 };
  ck.secoes.forEach((s) => { if (s.situacao) cont[s.situacao] += s.itens.length; });
  const novos = ck.secoes.reduce((n, s) => n + s.itens.filter((i) => i.sugerido).length, 0);
  const segs = vertentes.map((v) => `<button data-v="${v.id}" class="${v.id === vertente ? 'on' : ''}" ${v.disponivel ? '' : 'disabled title="Em breve"'}>
      ${esc(v.nome)}${v.disponivel ? '' : ' (em breve)'}</button>`).join('');
  const alerta = !ck.destination_contrato && vertente === 'destination'
    ? '<div class="aviso info">O contrato deste casal não está marcado como destination. Confira se este é o checklist certo.</div>' : '';

  $('#principal').innerHTML = `
    <div class="card">
      <div class="topo">
        <div class="info">
          <div class="num" style="font-weight:700;color:var(--marca-2)">${esc(e.numero_os)}</div>
          <h3>${esc(e.nomes)}</h3>
          <dl>
            <dt>Data</dt><dd>${e.data ? `${esc(e.data)} · ${esc(e.data_extenso)}` : `a definir${e.periodo ? ' (' + esc(e.periodo) + ')' : ''}`}</dd>
            <dt>Local</dt><dd>${esc(e.local || 'a definir')}</dd>
            <dt>Convidados</dt><dd>${esc(e.convidados || '–')}${e.padrinhos ? ` · ${esc(e.padrinhos)} casais de padrinhos` : ''}${e.criancas ? ` · ${esc(e.criancas)} crianças` : ''}</dd>
          </dl>
        </div>
        <div class="acoes">
          <div class="seg" id="seg">${segs}</div>
          <button class="btn primario" id="btnEvento" disabled>Gerar checklist do evento + painel do dia</button>
          <div id="statusPend" class="salvo"></div>
          <button class="btn" id="btnCrono">Gerar cronograma de tarefas (planilha)</button>
          <div class="det" style="font-size:12px;color:var(--suave)">Pasta: ${esc(ck.pasta)}${ck.pasta_existe ? '' : ' <b>(será criada)</b>'}</div>
          <div id="resultado"></div>
        </div>
      </div>
      ${alerta}
    </div>

    <div class="card">
      <h2><span class="passo">1</span>Informações do dia <span class="salvo" id="salvo"></span></h2>
      <div class="grade" id="info"></div>
    </div>

    <div class="card">
      <h2><span class="passo">2</span>Fornecedores <span class="salvo" id="qtdForn"></span></h2>
      <div class="det" style="font-size:13px;color:var(--suave);margin:-6px 0 8px">Vêm do controle financeiro (aba FINANCEIRO da planilha do casal). Complete telefone,
        responsável e horário de chegada. "Sem horário" = só contato (ex.: local, papelaria entregue antes).</div>
      <div class="linha-acoes" style="margin:0 0 10px">
        <button class="btn" id="btnImportar">Importar do controle financeiro</button>
        <button class="btn" id="btnColar">Colar do Google Planilhas</button>
        <span class="salvo" id="fonte"></span>
      </div>
      <div id="caixaColar" style="display:none;margin-bottom:10px">
        <div class="det" style="font-size:13px;margin-bottom:6px">No Google Planilhas, abra a aba <b>FINANCEIRO</b> da planilha do casal, selecione as colunas
          <b>Fornecedor</b> e <b>Descrição do Serviço</b> (pode incluir o cabeçalho), copie (Ctrl+C) e cole abaixo (Ctrl+V).</div>
        <textarea id="txtColar" style="min-height:120px" placeholder="Cole aqui…"></textarea>
        <div class="linha-acoes"><button class="btn primario" id="btnColarOk">Importar fornecedores colados</button>
          <button class="btn" id="btnColarCancelar">Cancelar</button></div>
      </div>
      <div style="overflow-x:auto"><table class="t" id="tForn"></table></div>
      <div class="linha-acoes"><button class="btn" id="btnAddForn">+ Adicionar fornecedor</button></div>
    </div>

    <div class="card">
      <h2><span class="passo">3</span>Atividades do dia</h2>
      <div class="det" style="font-size:13px;color:var(--suave);margin:-6px 0 8px">Todas precisam de horário. As chegadas dos fornecedores entram sozinhas no cronograma do dia.</div>
      <div style="overflow-x:auto"><table class="t" id="tAtiv"></table></div>
      <div class="linha-acoes"><button class="btn" id="btnAddAtiv">+ Adicionar atividade</button>
        <button class="btn" id="btnOrdenar">Ordenar por horário</button></div>
    </div>

    <div class="card">
      <h2><span class="passo">4</span>Cerimônia</h2>
      <div class="det" style="font-size:13px;color:var(--suave);margin:-6px 0 8px">Tudo aparece no painel do dia. Se algo não vai acontecer, escreva "não terá".</div>
      <div class="grade" id="gCerimonia"></div>
    </div>

    <div class="card">
      <h2><span class="passo">5</span>Festa</h2>
      <div class="grade" id="gFesta"></div>
      <h2 style="margin-top:16px;font-size:14px">Previsão artística (atrações) *</h2>
      <div class="det" style="font-size:13px;color:var(--suave);margin:-6px 0 8px">Os fornecedores de música entram aqui ao importar; complete início e fim de cada atração.</div>
      <div style="overflow-x:auto"><table class="t" id="tAtr"></table></div>
      <div class="linha-acoes"><button class="btn" id="btnAddAtr">+ Adicionar atração</button></div>
    </div>

    <div class="card">
      <h2><span class="passo">6</span>Antes de gerar</h2>
      <div id="pendencias"></div>
    </div>

    <details class="card" style="padding:0">
      <summary style="padding:16px 20px;cursor:pointer;font-weight:600;color:var(--marca)">Cronograma de tarefas · ${ck.meses_restantes ? `${ck.meses_restantes} ${ck.meses_restantes > 1 ? 'meses' : 'mês'} até o casamento${ck.comprimido ? ' (tarefas redistribuídas no tempo que falta)' : ''}` : 'evento já realizado ou sem data'} · ${ck.total_itens} tarefas
        ${e.data ? ` · <span style="color:var(--erro)">${cont.vencida} com prazo passado</span> · <span style="color:var(--ok)">${cont.atual} para agora</span>` : ''}</summary>
      <div style="padding:0 20px 16px">
      ${novos ? `<p class="det" style="font-size:13px;color:var(--suave)">${novos} itens sugeridos para revisar (marcados com <span class="novo" style="margin:0">novo</span>)</p>` : ''}
      ${ck.secoes.map((s) => `
        <details class="secao" ${s.situacao === 'atual' ? 'open' : ''}>
          <summary>
            <span class="rot">${esc(s.rotulo)}</span>
            ${s.inicio ? `<span class="per">${esc(s.inicio)} a ${esc(s.fim)}</span>` : ''}
            ${s.situacao ? `<span class="sit ${s.situacao}">${SIT[s.situacao]}</span>` : ''}
            <span class="qtd">${s.itens.length} tarefas</span>
          </summary>
          <ul class="itens">${s.itens.map((i) => `<li><span class="o">${i.ordem}</span>
            <span>${esc(i.texto)}${i.sugerido ? '<span class="novo" title="Item sugerido (não estava no checklist Hanna & Ivan)">novo</span>' : ''}</span></li>`).join('')}</ul>
        </details>`).join('')}
      </div>
    </details>`;

  document.querySelectorAll('#seg button[data-v]').forEach((b) => b.onclick = () => {
    if (b.disabled) return;
    vertente = b.dataset.v; selecionar(atual);
  });
  $('#btnEvento').onclick = () => gerar('evento', false);
  $('#btnCrono').onclick = () => gerar('cronograma', false);
  $('#btnImportar').onclick = importar;
  $('#btnColar').onclick = () => { $('#caixaColar').style.display = 'block'; $('#txtColar').focus(); };
  $('#btnColarCancelar').onclick = () => { $('#caixaColar').style.display = 'none'; };
  $('#btnColarOk').onclick = () => importar($('#txtColar').value);
  $('#btnAddForn').onclick = () => { EV.fornecedores.push({ id: novoId(), nome: '', servico: '', categoria: 'outros', responsavel: '', telefone: '', dia: 'evento', chegada: '', observacao: '', origem: 'manual' }); renderForn(); agendar(); };
  $('#btnAddAtiv').onclick = () => { EV.atividades.push({ id: novoId(), hora: '', texto: '', responsavel: '', detalhes: [], origem: 'manual' }); renderAtiv(); agendar(); };
  $('#btnAddAtr').onclick = () => { EV.atracoes.push({ id: novoId(), nome: '', inicio: '', fim: '', obs: '' }); renderAtr(); agendar(); };
  $('#btnOrdenar').onclick = () => { EV.atividades.sort((a, b) => minutos(a.hora) - minutos(b.hora)); renderAtiv(); agendar(); };
  carregarEvento();
}

const novoId = () => Math.random().toString(36).slice(2, 10);
const minutos = (h) => { const m = /^(\d{1,2}):(\d{2})$/.exec(h || ''); if (!m) return 9999; const t = +m[1] * 60 + +m[2]; return t < 300 ? t + 1440 : t; };
const horaOk = (h) => /^([01]?\d|2[0-3]):([0-5]\d)$/.test(h || '');
const telOk = (t) => String(t || '').replace(/\D/g, '').length >= 10;

async function carregarEvento() {
  try {
    const r = await api(`/api/evento?arquivo=${encodeURIComponent(atual)}`);
    EV = r.evento; META = { categorias: r.categorias, dias: r.dias, planilha: r.planilha, campos: r.campos }; PEND = r.pendencias;
    renderInfo(); renderForn(); renderAtiv(); renderGrupo('cerimonia', '#gCerimonia'); renderGrupo('festa', '#gFesta'); renderAtr(); renderPend(); renderFonte();
  } catch (e) { $('#pendencias').innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`; }
}

function renderFonte() {
  const p = META.planilha || {};
  $('#fonte').textContent = p.arquivo ? `Planilha: ${p.arquivo.split(/[\\/]/).pop()}` + (EV.importado_em ? ` · importado em ${new Date(EV.importado_em).toLocaleString('pt-BR')}` : '')
    : p.gsheet ? 'A planilha deste casal está no Google Planilhas: use "Colar do Google Planilhas"' : 'Planilha de assessoria não encontrada na pasta do casal: cadastre aqui ou cole do Google Planilhas';
}

const INFO = [
  ['hora_cerimonia', 'Horário da cerimônia *', 'time', 'c3'],
  ['local_cerimonia', 'Local da cerimônia *', 'text', 'c4'],
  ['local_recepcao', 'Local da recepção *', 'text', 'c5'],
  ['responsavel_montagem', 'Responsável pela montagem', 'text', 'c4'],
  ['telefone_assessoria', 'Telefone da assessoria (no dia)', 'tel', 'c4'],
  ['contato_emergencia', 'Contato de emergência (nome e telefone)', 'text', 'c4'],
  ['inicio_montagem_vespera', 'Início da montagem na véspera', 'time', 'c4'],
  ['inicio_montagem_dia', 'Início da montagem no dia', 'time', 'c4'],
  ['observacoes', 'Observações gerais', 'textarea', 'c12'],
];
function renderInfo() {
  $('#info').innerHTML = INFO.map(([k, rot, tipo, c]) => `<div class="${c === 'c5' ? 'c4' : c}"><label class="l">${esc(rot)}</label>
    ${tipo === 'textarea' ? `<textarea data-i="${k}">${esc(EV.info[k] || '')}</textarea>` : `<input type="${tipo}" data-i="${k}" value="${esc(EV.info[k] || '')}">`}</div>`).join('');
  document.querySelectorAll('[data-i]').forEach((el) => el.oninput = () => { EV.info[el.dataset.i] = el.value; marcarFaltas(); agendar(); });
  marcarFaltas();
}

function renderGrupo(grupo, alvo) {
  const dados = EV[grupo] = EV[grupo] || {};
  $(alvo).innerHTML = META.campos[grupo].map((c) => {
    const v = dados[c.id];
    const larg = c.tipo === 'lista' || c.tipo === 'longo' ? 'c6' : 'c4';
    const rot = `<label class="l">${esc(c.rotulo)}${c.opcional ? '' : ' *'}</label>`;
    let campo;
    if (c.tipo === 'opcao') campo = `<select data-g="${c.id}"><option value=""></option>${c.opcoes.map((o) => `<option${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    else if (c.tipo === 'lista') campo = `<textarea data-g="${c.id}" placeholder="${esc(c.dica || 'um item por linha')}">${esc((Array.isArray(v) ? v : []).join('\n'))}</textarea>`;
    else if (c.tipo === 'longo') campo = `<textarea data-g="${c.id}">${esc(v || '')}</textarea>`;
    else campo = `<input data-g="${c.id}" value="${esc(v || '')}" placeholder="${esc(c.dica || '')}">`;
    return `<div class="${larg}">${rot}${campo}</div>`;
  }).join('');
  $(alvo).querySelectorAll('[data-g]').forEach((el) => {
    const c = META.campos[grupo].find((x) => x.id === el.dataset.g);
    el.oninput = el.onchange = () => {
      EV[grupo] = EV[grupo] || {};
      EV[grupo][c.id] = c.tipo === 'lista' ? el.value.split('\n').map((x) => x.trim()).filter(Boolean) : el.value;
      marcarFaltas(); agendar();
    };
  });
  marcarFaltas();
}

function renderAtr() {
  $('#tAtr').innerHTML = `<tr><th style="min-width:200px">Atração *</th><th>Início *</th><th>Fim *</th><th style="min-width:200px">Observação</th><th></th></tr>` +
    EV.atracoes.map((a, i) => `<tr data-t="${i}">
      <td><input data-c="nome" value="${esc(a.nome)}"></td>
      <td><input type="time" data-c="inicio" value="${esc(a.inicio)}"></td>
      <td><input type="time" data-c="fim" value="${esc(a.fim)}"></td>
      <td><input data-c="obs" value="${esc(a.obs || '')}"></td>
      <td><button class="x" title="Remover" data-del="${i}">×</button></td></tr>`).join('');
  document.querySelectorAll('#tAtr tr[data-t]').forEach((tr) => {
    const a = EV.atracoes[+tr.dataset.t];
    tr.querySelectorAll('[data-c]').forEach((el) => { el.oninput = el.onchange = () => { a[el.dataset.c] = el.value; marcarFaltas(); agendar(); }; });
  });
  document.querySelectorAll('#tAtr [data-del]').forEach((b) => b.onclick = () => { EV.atracoes.splice(+b.dataset.del, 1); renderAtr(); agendar(); });
  marcarFaltas();
}

function renderForn() {
  const cats = META.categorias.map((c) => `<option value="${c.id}">${esc(c.nome)}</option>`).join('');
  const dias = Object.entries(META.dias).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('');
  $('#qtdForn').textContent = `· ${EV.fornecedores.length} cadastrados`;
  $('#tForn').innerHTML = `<tr><th style="min-width:140px">Fornecedor *</th><th style="min-width:140px">Serviço</th><th>Categoria</th><th>Responsável</th>
      <th style="min-width:130px">Telefone *</th><th>Quando</th><th>Chegada *</th><th style="min-width:120px">Observação</th><th></th></tr>` +
    EV.fornecedores.map((f, i) => `<tr data-f="${i}">
      <td><input data-c="nome" value="${esc(f.nome)}"></td>
      <td><input data-c="servico" value="${esc(f.servico)}"></td>
      <td><select data-c="categoria">${cats}</select></td>
      <td><input data-c="responsavel" value="${esc(f.responsavel)}"></td>
      <td><input data-c="telefone" type="tel" placeholder="(81) 9 0000-0000" value="${esc(f.telefone)}"></td>
      <td><select data-c="dia">${dias}</select></td>
      <td><input data-c="chegada" type="time" value="${esc(f.chegada)}"></td>
      <td><input data-c="observacao" value="${esc(f.observacao)}"></td>
      <td><button class="x" title="Remover" data-del="${i}">×</button></td></tr>`).join('');
  document.querySelectorAll('#tForn tr[data-f]').forEach((tr) => {
    const f = EV.fornecedores[+tr.dataset.f];
    tr.querySelector('[data-c=categoria]').value = f.categoria || 'outros';
    tr.querySelector('[data-c=dia]').value = f.dia || 'evento';
    tr.querySelectorAll('[data-c]').forEach((el) => {
      el.oninput = el.onchange = () => { f[el.dataset.c] = el.value; if (el.dataset.c === 'dia') renderForn(); else marcarFaltas(); agendar(); };
    });
  });
  document.querySelectorAll('#tForn [data-del]').forEach((b) => b.onclick = () => {
    if (!confirm('Remover este fornecedor do checklist?')) return;
    EV.fornecedores.splice(+b.dataset.del, 1); renderForn(); agendar();
  });
  marcarFaltas();
}

function renderAtiv() {
  const opcoes = '<option value="">—</option>' + EV.fornecedores.map((f) => `<option value="${f.id}">${esc(f.nome)}</option>`).join('');
  $('#tAtiv').innerHTML = `<tr><th>Horário *</th><th style="min-width:280px">Atividade *</th><th>Responsável</th><th>Fornecedor</th><th></th></tr>` +
    EV.atividades.map((a, i) => `<tr data-a="${i}">
      <td style="width:110px"><input type="time" data-c="hora" value="${esc(a.hora)}"></td>
      <td><input data-c="texto" value="${esc(a.texto)}">${(a.detalhes || []).length ? `<div class="salvo">${a.detalhes.length} orientações no checklist</div>` : ''}</td>
      <td><input data-c="responsavel" value="${esc(a.responsavel || '')}"></td>
      <td><select data-c="fornecedor_id">${opcoes}</select></td>
      <td><button class="x" title="Remover" data-del="${i}">×</button></td></tr>`).join('');
  document.querySelectorAll('#tAtiv tr[data-a]').forEach((tr) => {
    const a = EV.atividades[+tr.dataset.a];
    tr.querySelector('[data-c=fornecedor_id]').value = a.fornecedor_id || '';
    tr.querySelectorAll('[data-c]').forEach((el) => { el.oninput = el.onchange = () => { a[el.dataset.c] = el.value; marcarFaltas(); agendar(); }; });
  });
  document.querySelectorAll('#tAtiv [data-del]').forEach((b) => b.onclick = () => { EV.atividades.splice(+b.dataset.del, 1); renderAtiv(); agendar(); });
  marcarFaltas();
}

function marcarFaltas() {
  for (const [grupo, alvo] of [['cerimonia', '#gCerimonia'], ['festa', '#gFesta']]) {
    if (!META.campos || !$(alvo)) continue;
    META.campos[grupo].forEach((c) => {
      const el = $(alvo).querySelector(`[data-g="${c.id}"]`);
      if (!el || c.opcional) return;
      const v = EV[grupo][c.id];
      el.classList.toggle('falta', Array.isArray(v) ? v.length === 0 : !String(v || '').trim());
    });
  }
  document.querySelectorAll('#tAtr tr[data-t]').forEach((tr) => {
    const a = EV.atracoes[+tr.dataset.t];
    tr.querySelector('[data-c=nome]').classList.toggle('falta', !String(a.nome || '').trim());
    tr.querySelector('[data-c=inicio]').classList.toggle('falta', !horaOk(a.inicio));
    tr.querySelector('[data-c=fim]').classList.toggle('falta', !horaOk(a.fim));
  });
  document.querySelectorAll('[data-i=hora_cerimonia]').forEach((el) => el.classList.toggle('falta', !horaOk(el.value)));
  ['local_cerimonia', 'local_recepcao'].forEach((k) => document.querySelectorAll(`[data-i=${k}]`).forEach((el) => el.classList.toggle('falta', !el.value.trim())));
  document.querySelectorAll('#tForn tr[data-f]').forEach((tr) => {
    const f = EV.fornecedores[+tr.dataset.f];
    tr.querySelector('[data-c=nome]').classList.toggle('falta', !String(f.nome || '').trim());
    tr.querySelector('[data-c=telefone]').classList.toggle('falta', !telOk(f.telefone));
    const ch = tr.querySelector('[data-c=chegada]');
    ch.disabled = f.dia === 'nao';
    ch.classList.toggle('falta', f.dia !== 'nao' && !horaOk(f.chegada));
  });
  document.querySelectorAll('#tAtiv tr[data-a]').forEach((tr) => {
    const a = EV.atividades[+tr.dataset.a];
    tr.querySelector('[data-c=hora]').classList.toggle('falta', !horaOk(a.hora));
    tr.querySelector('[data-c=texto]').classList.toggle('falta', !String(a.texto || '').trim());
  });
}

function renderPend() {
  const n = PEND.length;
  $('#btnEvento').disabled = n > 0;
  $('#statusPend').innerHTML = n ? `<span style="color:var(--erro)">Faltam ${n} informações para gerar (veja o passo 6)</span>` : '<span class="ok-tudo">Tudo preenchido — pronto para gerar</span>';
  $('#pendencias').innerHTML = n
    ? `<div>Faltam <b>${n}</b> informações. Os campos em vermelho acima precisam ser preenchidos:</div><ul class="pend">${PEND.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>`
    : '<div class="ok-tudo">Tudo preenchido. Gere o checklist do evento e o painel do dia no botão do topo.</div>';
}

function agendar() {
  $('#salvo').textContent = '· salvando…';
  clearTimeout(tSalvar);
  tSalvar = setTimeout(async () => {
    try {
      const r = await api('/api/evento', { arquivo: atual, evento: EV });
      PEND = r.pendencias; renderPend();
      $('#salvo').textContent = `· salvo às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}`;
    } catch (e) { $('#salvo').textContent = `· erro ao salvar: ${e.message}`; }
  }, 600);
}

async function importar(texto) {
  const b = $('#btnImportar'); b.disabled = true;
  try {
    const r = await api('/api/evento/importar', { arquivo: atual, texto: typeof texto === 'string' ? texto : undefined });
    if (typeof texto === 'string') { $('#caixaColar').style.display = 'none'; $('#txtColar').value = ''; }
    EV = r.evento; PEND = r.pendencias; META.planilha = r.planilha;
    renderInfo(); renderForn(); renderAtiv(); renderGrupo('cerimonia', '#gCerimonia'); renderGrupo('festa', '#gFesta'); renderAtr(); renderPend(); renderFonte();
    $('#fonte').textContent += ` · ${r.novos} novo(s) fornecedor(es)`;
  } catch (e) { alert(e.message); } finally { b.disabled = false; }
}

async function gerar(tipo, novaVersao) {
  const out = $('#resultado');
  const botoes = [$('#btnEvento'), $('#btnCrono')];
  botoes.forEach((b) => { b.disabled = true; });
  out.innerHTML = '<div class="aviso info">Gerando…</div>';
  try {
    clearTimeout(tSalvar);
    if (tipo === 'evento') { const s = await api('/api/evento', { arquivo: atual, evento: EV }); PEND = s.pendencias; }
    const r = await api('/api/checklist/gerar', { arquivo: atual, vertente, tipo, novaVersao });
    const nomes = (r.arquivos || [r.arquivo]).map((a) => `<b>${esc(a.split(/[\\/]/).pop())}</b>`).join('<br>');
    if (r.existe) {
      out.innerHTML = `<div class="aviso info">Já existe na pasta do casal: <b>${esc(r.arquivo.split(/[\\/]/).pop())}</b>.
        Não foi alterado, para não perder o que já foi preenchido.<br>
        <button class="btn" id="bPasta">Abrir pasta</button><button class="btn" id="bNova">Gerar nova versão</button></div>`;
      $('#bNova').onclick = () => gerar(tipo, true);
    } else {
      document.querySelectorAll('.acoes .det b').forEach((b) => b.remove());
      out.innerHTML = `<div class="aviso ok">Criado:<br>${nomes}${tipo === 'evento' ? '<br><span style="font-size:12px">Envie o PAINEL (.html) para o iPad da equipe.</span>' : ''}<br><button class="btn" id="bPasta">Abrir pasta</button></div>`;
    }
    $('#bPasta').onclick = () => api('/api/abrir', { caminho: r.pasta }).catch((e) => alert(e.message));
  } catch (e) {
    out.innerHTML = `<div class="aviso erro">${esc(e.message)}</div>`;
  } finally {
    $('#btnCrono').disabled = false;
    renderPend();
  }
}

(async () => {
  try {
    [contratos, vertentes] = await Promise.all([api('/api/contratos'), api('/api/checklist/vertentes')]);
    renderLista();
    const pre = new URLSearchParams(location.search).get('contrato');
    if (pre) selecionar(pre);
  } catch (e) {
    $('#lista').innerHTML = `<li class="vazio">${esc(e.message)}</li>`;
  }
})();
$('#busca').addEventListener('input', renderLista);
</script>
</body>
</html>
